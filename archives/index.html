<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monolith — Archives</title>
    <style>
        :root {
            --bg-color: #0a0a0a;
            --text-color: #ffffff;
            --accent-color: #f0f0f0;
            --border-color: rgba(255, 255, 255, 0.35);
            --font-mono: 'Courier New', Courier, monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.5;
            padding: 0 20px;
            position: relative;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Background Layer with Custom TMDB Image */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            background-image: 
                linear-gradient(
                    to bottom, 
                    rgba(0, 0, 0, 0.3) 0%, 
                    rgba(0, 0, 0, 0.15) 50%, 
                    rgba(10, 10, 10, 0.88) 100%
                ),
                url('https://image.tmdb.org/t/p/original/2110dh8Y40xnEKiBtOQ0YFkfCaL.jpg');
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            filter: brightness(1.15) contrast(1.05);
            pointer-events: none;
        }

        /* Navigation */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
            padding: 20px 0;
            border-bottom: 1px solid var(--border-color);
        }

        .logo {
            font-family: var(--font-mono);
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            font-size: 1.2rem;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.95), 0 0 4px rgba(0, 0, 0, 0.9);
        }

        .nav-links {
            display: flex;
            gap: 20px;
            list-style: none;
        }

        .nav-links a {
            color: var(--accent-color);
            text-decoration: none;
            font-size: 0.9rem;
            font-family: var(--font-mono);
            transition: color 0.2s ease;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.95), 0 0 4px rgba(0, 0, 0, 0.9);
        }

        .nav-links a.active {
            color: #ffffff;
            border-bottom: 1px solid #ffffff;
        }

        .nav-links a:hover {
            color: #ffffff;
        }

        /* Main Container */
        main {
            max-width: 800px;
            width: 100%;
            margin: 80px auto 40px auto;
        }

        /* Header Section */
        .archive-header {
            margin-bottom: 40px;
        }

        h1 {
            font-size: 3.2rem;
            font-weight: 500;
            letter-spacing: 2px;
            margin-bottom: 8px;
            text-transform: uppercase;
            text-shadow: 0 3px 12px rgba(0, 0, 0, 0.98), 0 0 6px rgba(0, 0, 0, 0.9);
        }

        .meta-info {
            font-family: var(--font-mono);
            color: var(--accent-color);
            font-size: 0.95rem;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.98), 0 0 5px rgba(0, 0, 0, 0.9);
        }

        /* Subject List Container */
        .subject-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Glassmorphic Interaction Cards matching Home Page CTA buttons */
        .subject-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 24px;
            background: rgba(10, 10, 10, 0.5);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            text-decoration: none;
            color: #ffffff;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
        }

        .subject-row:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.95);
            transform: translateY(-3px) scale(1.01);
            box-shadow: 
                0 10px 30px rgba(0, 0, 0, 0.7),
                0 0 20px rgba(255, 255, 255, 0.25);
        }

        .subject-title {
            font-size: 1.3rem;
            font-weight: 500;
            letter-spacing: 0.5px;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.95);
        }

        .subject-arrow {
            font-family: var(--font-mono);
            font-size: 1.1rem;
            color: var(--accent-color);
            transition: transform 0.2s ease, color 0.2s ease;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.9);
        }

        .subject-row:hover .subject-arrow {
            color: #ffffff;
            transform: translateX(6px);
        }

        /* Footer */
        footer {
            max-width: 800px;
            width: 100%;
            margin: 50px auto 30px auto;
            text-align: center;
            font-family: var(--font-mono);
            font-size: 0.8rem;
            color: var(--accent-color);
            border-top: 1px solid var(--border-color);
            padding-top: 20px;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.95);
        }
    </style>
</head>
<body>

    <nav>
        <div class="logo">Monolith</div>
        <ul class="nav-links">
            <li><a href="https://fidelioa.github.io/monolith">Home</a></li>
            <li><a href="https://fidelioa.github.io/monolith/archives" class="active">Archives</a></li>
            <li><a href="https://fidelioa.github.io/monolith/about">About</a></li>
        </ul>
    </nav>

    <main>
        <section class="archive-header">
            <h1>Archives</h1>
            <p class="meta-info">Index of structured knowledge bases.</p>
        </section>

        <section class="content">
            <div class="subject-list">
                
                <a href="https://fidelioa.github.io/monolith/archives/forensic" class="subject-row">
                    <span class="subject-title">Forensic Medicine &amp; Toxicology</span>
                    <span class="subject-arrow">&rarr;</span>
                </a>

                <a href="https://fidelioa.github.io/monolith/archives/commed" class="subject-row">
                    <span class="subject-title">Community Medicine</span>
                    <span class="subject-arrow">&rarr;</span>
                </a>

                <a href="https://fidelioa.github.io/monolith/archives/ophthalmology" class="subject-row">
                    <span class="subject-title">Ophthalmology</span>
                    <span class="subject-arrow">&rarr;</span>
                </a>

            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 MONOLITH. Built to persist.</p>
    </footer>

</body>
</html>
